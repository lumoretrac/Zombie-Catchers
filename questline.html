<title>Questline</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700;800&display=swap">
<style>
/* Layout: one phone column (max 540px) · sticky HUD bar · scrolling quest stack · fixed glass dock with a raised + button.
   Deliberately single-theme: a neon night arcade screen, dark on every host. */
:root {
  color-scheme: dark;
  --void: #0a0612;
  --void-2: #130a22;
  --glass: rgba(30, 18, 52, 0.68);
  --glass-2: rgba(46, 28, 80, 0.62);
  --line: rgba(196, 160, 255, 0.13);
  --line-2: rgba(214, 182, 255, 0.3);
  --ink: #f5efff;
  --ink-2: #bcaedb;
  --ink-3: #8a7ca8;
  --on-neon: #12061f;
  --violet: #a855f7;
  --violet-hi: #c99bff;
  --pink: #ff3ea5;
  --good: #3cf5a4;
  --warn: #ffb547;
  --bad: #ff4d6d;
  --bad-ink: #ffb3c2;
  --warn-ink: #ffe2b3;
  --flame: #ff8a3d;
  --flame-ink: #ffb27a;
  --q-violet: #b06cff;
  --q-pink: #ff4fae;
  --q-cyan: #38e1ff;
  --q-mint: #3cf5a4;
  --q-amber: #ffb547;
  --q-coral: #ff6b7f;
  --heat-0: rgba(255, 255, 255, 0.055);
  --heat-1: #351a5e;
  --heat-2: #5a27a6;
  --heat-3: #8e43f0;
  --heat-4: #d6aaff;
  --grad: linear-gradient(110deg, var(--violet), var(--pink));
  --f-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-hud: "Chakra Petch", ui-monospace, "SF Mono", Menlo, monospace;
  --r-xl: 26px;
  --r-lg: 20px;
  --r-md: 16px;
  --r-sm: 12px;
  --ease: cubic-bezier(.2, .8, .2, 1);
}
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--void); -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100%;
  background: var(--void);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(112px + env(safe-area-inset-bottom, 0px));
  overflow-x: clip;
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 30; background: var(--void);
}
body.locked { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--violet-hi); outline-offset: 2px; }
a { color: var(--violet-hi); }

/* ---------- atmosphere ---------- */
.atmos { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.atmos::before {
  content: ""; position: absolute; inset: -20% -30% auto; height: 70%;
  background:
    radial-gradient(40% 50% at 20% 30%, rgba(168, 85, 247, .30), transparent 70%),
    radial-gradient(35% 45% at 85% 20%, rgba(255, 62, 165, .20), transparent 70%);
  filter: blur(10px);
}
.atmos::after {
  content: ""; position: absolute; left: -60%; right: -60%; bottom: -8%; height: 46%;
  background-image:
    linear-gradient(rgba(176, 108, 255, .22) 1px, transparent 1px),
    linear-gradient(90deg, rgba(176, 108, 255, .22) 1px, transparent 1px);
  background-size: 54px 54px;
  transform: perspective(320px) rotateX(64deg);
  transform-origin: 50% 100%;
  -webkit-mask-image: linear-gradient(to top, #000 0%, transparent 75%);
  mask-image: linear-gradient(to top, #000 0%, transparent 75%);
  opacity: .55;
  animation: gridrun 7s linear infinite;
}
@keyframes gridrun { to { background-position: 0 54px, 0 0; } }
#app { position: relative; z-index: 1; max-width: 540px; margin: 0 auto; }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 90; }

/* ---------- type ---------- */
.hud { font-family: var(--f-hud); font-weight: 600; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); margin: 0; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- header ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 10px;
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 10px;
  background: linear-gradient(rgba(10, 6, 18, .92), rgba(10, 6, 18, .72));
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.brand {
  font-family: var(--f-display); font-weight: 800; font-size: 15px; letter-spacing: .16em;
  background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 10px rgba(255, 62, 165, .35));
}
.sync { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 6px 4px; color: var(--ink-3); font-family: var(--f-hud); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
.sync.cloud i { background: var(--good); box-shadow: 0 0 8px var(--good); }
.sync.saving i { background: var(--warn); box-shadow: 0 0 8px var(--warn); animation: blink 1s infinite; }
.sync.error i { background: var(--bad); box-shadow: 0 0 8px var(--bad); }
@keyframes blink { 50% { opacity: .3; } }
.top .grow { flex: 1; }
.lvl-chip {
  display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line-2); border-radius: 999px;
  background: var(--glass); padding: 4px 12px 4px 4px;
}
.lvl-chip .hex {
  width: 30px; height: 30px; display: grid; place-items: center; background: var(--grad); color: var(--on-neon);
  clip-path: polygon(50% 0, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
  font-family: var(--f-display); font-weight: 800; font-size: 12px;
}
.lvl-chip span { font-family: var(--f-hud); font-weight: 600; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }

/* ---------- generic ---------- */
.view { display: flex; flex-direction: column; gap: 18px; padding-top: 18px; }
.view.enter { animation: viewin .32s var(--ease); }
@keyframes viewin { from { opacity: .4; transform: translateY(8px); } }
.card { background: var(--glass); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.sec { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-top: 4px; }
.sec h2 { font-family: var(--f-display); font-weight: 700; font-size: 16px; letter-spacing: .01em; }
.sec .hud { letter-spacing: .1em; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.group-label { margin: 4px 2px -2px; }
.ic { width: 20px; height: 20px; flex: none; }
.ic.fill { fill: currentColor; stroke: none; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px;
  border-radius: 14px; border: 1px solid var(--line-2); background: var(--glass-2); color: var(--ink);
  font-weight: 700; font-size: 15px; text-decoration: none; transition: transform .12s var(--ease);
}
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--grad); border-color: transparent; color: #fff; box-shadow: 0 8px 28px -10px rgba(255, 62, 165, .75); }
.btn.danger { border-color: rgba(255, 77, 109, .5); color: var(--bad-ink); background: rgba(255, 77, 109, .12); }
.btn.danger.armed { background: var(--bad); color: #fff; }
.btn.ghost { background: transparent; }
.btn.small { min-height: 38px; padding: 0 14px; font-size: 14px; border-radius: 12px; }
.btn .ic { width: 18px; height: 18px; }
.btn.block { width: 100%; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--glass); display: grid; place-items: center; color: var(--ink-2); }
.empty { text-align: center; padding: 26px 18px; color: var(--ink-2); border: 1px dashed var(--line-2); border-radius: var(--r-lg); }
.empty b { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }

/* ---------- today: hello ---------- */
.hello { display: flex; flex-direction: column; gap: 6px; }
.hello h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(24px, 7vw, 30px); line-height: 1.12; letter-spacing: -.01em; }
.hello h1 em { font-style: normal; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hello p.sub { margin: 0; color: var(--ink-2); max-width: 40ch; }
.xp { display: flex; flex-direction: column; gap: 7px; }
.xp-row { display: flex; justify-content: space-between; gap: 10px; font-family: var(--f-hud); font-size: 12.5px; letter-spacing: .06em; color: var(--ink-2); text-transform: uppercase; }
.xp-row b { color: var(--ink); font-weight: 700; }
.xp-track { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, .06); border: 1px solid var(--line); overflow: hidden; }
.xp-track i { display: block; height: 100%; width: var(--w, 0%); background: var(--grad); border-radius: 999px; box-shadow: 0 0 16px rgba(255, 62, 165, .7); transition: width .7s var(--ease); }

/* week strip */
.ws { display: flex; align-items: center; gap: 4px; }
.ws-nav { width: 26px; height: 52px; border: 0; background: none; color: var(--ink-3); display: grid; place-items: center; padding: 0; flex: none; }
.ws-nav:disabled { opacity: .25; }
.ws-days { flex: 1; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.ws-day { border: 1px solid transparent; background: none; border-radius: 14px; padding: 6px 0 5px; display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; }
.ws-day:disabled { opacity: .32; }
.ws-day.sel { border-color: var(--line-2); background: var(--glass-2); box-shadow: 0 0 18px -6px var(--violet); }
.ws-dow { font-family: var(--f-hud); font-size: 11px; letter-spacing: .1em; color: var(--ink-3); }
.ws-day.today .ws-dow { color: var(--pink); }
.ws-ring { position: relative; width: 34px; height: 34px; display: grid; place-items: center; }
.ws-ring svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.ws-ring .t { fill: none; stroke: rgba(255, 255, 255, .08); stroke-width: 3; }
.ws-ring .f { fill: none; stroke: var(--violet-hi); stroke-width: 3; stroke-linecap: round; transition: stroke-dashoffset .6s var(--ease); }
.ws-day.full .ws-ring .f { stroke: var(--pink); filter: drop-shadow(0 0 4px var(--pink)); }
.ws-ring b { font-family: var(--f-display); font-size: 11.5px; font-weight: 700; font-variant-numeric: tabular-nums; }

/* hero ring */
.hero { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 18px; padding: 18px; }
.ring { position: relative; width: 132px; height: 132px; }
.ring svg { width: 100%; height: 100%; display: block; overflow: visible; }
.ring .track { fill: none; stroke: rgba(255, 255, 255, .07); stroke-width: 11; }
.ring .fill { fill: none; stroke-width: 11; stroke-linecap: round; transition: stroke-dashoffset .8s var(--ease); filter: drop-shadow(0 0 8px rgba(255, 62, 165, .55)); }
.ring stop.a { stop-color: var(--violet); }
.ring stop.b { stop-color: var(--pink); }
.ring-c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring-c b { font-family: var(--f-display); font-weight: 800; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.ring-c b small { font-size: 15px; }
.ring-c span { font-family: var(--f-hud); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); margin-top: 4px; }
.hero.cleared .ring-c b { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero-stats { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.hero-stats li { display: grid; grid-template-columns: 30px minmax(0, 1fr); align-items: center; gap: 10px; }
.hero-stats .hi { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; background: rgba(255, 255, 255, .05); border: 1px solid var(--line); }
.hero-stats .hi .ic { width: 16px; height: 16px; }
.hero-stats b { display: block; font-family: var(--f-display); font-weight: 700; font-size: 16px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.hero-stats span { display: block; font-size: 12.5px; color: var(--ink-3); }
.c-flame { color: var(--flame); }
.c-bolt { color: var(--warn); }
.c-gem { color: var(--violet-hi); }

.daybar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px 10px 14px; border-radius: var(--r-md); background: rgba(255, 181, 71, .1); border: 1px solid rgba(255, 181, 71, .35); color: var(--warn-ink); font-size: 14px; }

/* reminders alert */
.alert { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 12px 14px; border-radius: var(--r-md); border: 1px solid rgba(255, 77, 109, .45); background: rgba(255, 77, 109, .1); color: var(--bad-ink); }
.alert.soft { border-color: var(--line-2); background: var(--glass); color: var(--ink-2); }
.alert .grow { flex: 1; }
.alert b { color: var(--ink); }

/* ---------- quest card ---------- */
.q {
  position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px;
  padding: 12px 12px 15px; border-radius: var(--r-md); background: var(--glass); border: 1px solid var(--line);
  overflow: hidden; transition: border-color .3s, box-shadow .3s;
}
.q.done { border-color: color-mix(in srgb, var(--c) 55%, transparent); box-shadow: 0 0 26px -10px var(--c), inset 0 0 30px -18px var(--c); }
.q-main { display: flex; align-items: center; gap: 12px; min-width: 0; background: none; border: 0; padding: 0; text-align: left; }
.q-ico {
  position: relative; flex: none; width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; overflow: hidden;
  background: color-mix(in srgb, var(--c) 12%, transparent); border: 1px solid color-mix(in srgb, var(--c) 35%, transparent);
  font-size: 23px; line-height: 1;
}
.q-ico::before {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: var(--fill, 0%);
  background: linear-gradient(to top, color-mix(in srgb, var(--c) 60%, transparent), color-mix(in srgb, var(--c) 22%, transparent));
  transition: height .6s var(--ease);
}
.q-ico span { position: relative; }
.q-txt { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.q-name { font-weight: 700; font-size: 15.5px; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.q-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 9px; font-family: var(--f-hud); font-size: 12.5px; letter-spacing: .02em; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.chip-done { display: inline-flex; align-items: center; gap: 3px; color: var(--on-neon); background: var(--c); border-radius: 6px; padding: 0 6px 0 4px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 11px; line-height: 18px; }
.chip-done .ic { width: 12px; height: 12px; stroke-width: 3; }
.chip-warn { color: var(--warn); }
.strk { display: inline-flex; align-items: center; gap: 2px; color: var(--flame-ink); }
.strk .ic { width: 13px; height: 13px; color: var(--flame); }
.pips { display: inline-flex; gap: 3px; }
.pips i { width: 9px; height: 9px; border-radius: 3px; background: rgba(255, 255, 255, .1); border: 1px solid var(--line-2); }
.pips i.on { background: var(--c); border-color: transparent; box-shadow: 0 0 6px var(--c); }
.q-ctl { display: flex; align-items: center; gap: 6px; }
.rb {
  width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; padding: 0;
  border: 1px solid var(--line-2); background: rgba(255, 255, 255, .04); color: var(--ink-2);
  transition: transform .12s var(--ease), box-shadow .2s;
}
.rb:disabled { opacity: .3; }
.rb:active:not(:disabled) { transform: scale(.88); }
.rb .ic { width: 18px; height: 18px; stroke-width: 2.4; }
.rb.go { background: var(--c, var(--violet)); color: var(--on-neon); border-color: transparent; box-shadow: 0 0 18px -5px var(--c, var(--violet)); font-family: var(--f-display); font-weight: 800; font-size: 11.5px; }
.val { min-width: 44px; height: 40px; border: 0; background: none; font-family: var(--f-display); font-weight: 700; font-size: 15px; padding: 0 2px; font-variant-numeric: tabular-nums; border-bottom: 1px dashed var(--line-2); border-radius: 0; }
.ck {
  width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; padding: 0;
  border: 2px solid color-mix(in srgb, var(--c) 65%, transparent); background: transparent; color: transparent;
  transition: background .25s, box-shadow .25s, transform .12s var(--ease);
}
.ck .ic { width: 22px; height: 22px; stroke-width: 3; transform: scale(.4); transition: transform .3s var(--ease); }
.ck.on { background: var(--c); color: var(--on-neon); border-color: transparent; box-shadow: 0 0 20px -3px var(--c); }
.ck.on .ic { transform: scale(1); }
.ck:active { transform: scale(.9); }
.q-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255, 255, 255, .04); }
.q-bar i { display: block; height: 100%; width: var(--fill, 0%); background: var(--c); box-shadow: 0 0 10px var(--c); transition: width .6s var(--ease); }
.flash { animation: flash .7s var(--ease); }
@keyframes flash { 30% { transform: scale(1.025); box-shadow: 0 0 40px -6px var(--c); } }
.pop { animation: pop .35s var(--ease); }
@keyframes pop { 40% { transform: scale(1.25); } }

/* ---------- reminders ---------- */
.quick { display: flex; flex-direction: column; gap: 10px; padding: 12px; }
.quick-row { display: flex; gap: 8px; }
.quick-row input { flex: 1; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; inset: 0; margin: 0; pointer-events: none; }
.chip span, .chip-btn { display: inline-flex; align-items: center; gap: 5px; min-height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line-2); background: rgba(255, 255, 255, .03); color: var(--ink-2); font-size: 13px; font-weight: 600; cursor: pointer; }
.chip input:checked + span { background: var(--violet); border-color: transparent; color: #fff; box-shadow: 0 0 14px -4px var(--violet); }
.chip input:focus-visible + span { outline: 2px solid var(--violet-hi); outline-offset: 2px; }
.chip-time { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 4px 0 12px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--ink-2); font-size: 13px; font-weight: 600; }
.chip-time input[type="time"] { border: 0; background: none; box-shadow: none; min-height: 30px; padding: 0 8px 0 0; font-size: 16px; width: 112px; color: var(--ink); }
.rem-group { display: flex; flex-direction: column; gap: 8px; }
.rem { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--r-md); background: var(--glass); border: 1px solid var(--line); }
.rem.overdue { border-color: rgba(255, 77, 109, .5); box-shadow: 0 0 22px -12px var(--bad); }
.rem.today { border-color: color-mix(in srgb, var(--violet) 55%, transparent); }
.rem.is-done { opacity: .55; }
.rem.is-done .rem-title { text-decoration: line-through; text-decoration-color: var(--ink-3); }
.rem-check { --c: var(--violet); width: 30px; height: 30px; }
.rem-check .ic { width: 16px; height: 16px; }
.rem.overdue .rem-check { --c: var(--bad); }
.rem-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; border: 0; background: none; padding: 4px 0; text-align: left; }
.rem-title { font-weight: 700; overflow-wrap: anywhere; }
.rem-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-family: var(--f-hud); font-size: 12.5px; color: var(--ink-2); }
.rem-meta .ic { width: 13px; height: 13px; }
.rem-meta > span { display: inline-flex; align-items: center; gap: 4px; }
.rem.overdue .when { color: var(--bad-ink); }
.flag { color: var(--pink); display: grid; place-items: center; }
.flag .ic { width: 18px; height: 18px; }

/* ---------- stats ---------- */
.lvl-card { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px 16px; align-items: center; }
.lvl-hex {
  width: 78px; height: 86px; display: grid; place-content: center; text-align: center; background: var(--grad); color: var(--on-neon);
  clip-path: polygon(50% 0, 96% 25%, 96% 75%, 50% 100%, 4% 75%, 4% 25%);
  filter: drop-shadow(0 0 16px rgba(255, 62, 165, .5));
}
.lvl-hex span { font-family: var(--f-hud); font-weight: 700; font-size: 11px; letter-spacing: .16em; }

const clone = o => (o == null ? o : JSON.parse(JSON.stringify(o)));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const round2 = n => Math.round(n * 100) / 100;
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return Number.isFinite(n) ? n : NaN; };
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const reduceMotion = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();

const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DOW_LONG = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MON_LONG = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const ALLDAYS = [0, 1, 2, 3, 4, 5, 6];

const pad = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
const todayKey = () => keyOf(new Date());
const dow = k => parseKey(k).getDay();
const monthOf = k => k.slice(0, 7);
const weekStartOf = k => { const ws = S.profile?.settings?.weekStart ?? 1; return addDays(k, -((dow(k) - ws + 7) % 7)); };
const fmtDay = k => { const d = parseKey(k); return `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`; };
const fmtDayLong = k => { const d = parseKey(k); return `${DOW_LONG[d.getDay()]}, ${d.getDate()} ${MON_LONG[d.getMonth()]}`; };
const nowHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
function fmtTime(t) { if (!t) return ''; const [h, m] = t.split(':').map(Number); return `${((h + 11) % 12) + 1}:${pad(m)} ${h < 12 ? 'AM' : 'PM'}`; }
function relDay(k) {
  const T = todayKey();
  if (k === T) return 'Today';
  if (k === addDays(T, 1)) return 'Tomorrow';
  if (k === addDays(T, -1)) return 'Yesterday';
  if (k > T && k < addDays(T, 7)) return DOW_LONG[dow(k)];
  return fmtDay(k);
}
function fmtNum(v) {
  if (v >= 1000) return Math.round(v).toLocaleString('en-US');
  return Number.isInteger(v) ? String(v) : String(round2(v));
}
function fmtCompact(v) {
  if (v >= 1000) { const k = v / 1000; return (Number.isInteger(k) ? k : round2(k).toFixed(1).replace(/\.0$/, '')) + 'k'; }
  return fmtNum(v);
}
function addMonths(k, n) {
  const d = parseKey(k); const day = d.getDate();
  d.setDate(1); d.setMonth(d.getMonth() + n);
  const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(day, last));
  return keyOf(d);
}

const S = { profile: null, logs: {}, tab: 'today', sel: todayKey(), booting: true, lastTab: null, today: todayKey() };

function habitDefaults(over = {}) {
  return Object.assign({ id: uid('h'), tpl: null, name: '', icon: '⭐', color: 'violet', type: 'check', target: 1, unit: '', step: 1, max: null, days: ALLDAYS.slice(), time: 'anytime', xp: 20, note: '', createdAt: todayKey(), archived: false, archivedAt: null }, over);
}
function migrate(p) {
  if (!p || typeof p !== 'object') return null;
  const T = todayKey();
  p.v = 1;
  p.name = typeof p.name === 'string' ? p.name : '';
  p.settings = Object.assign({ sound: true, haptics: true, weekStart: 1 }, p.settings || {});
  p.habits = Array.isArray(p.habits) ? p.habits.filter(h => h && h.id).map(h => {
    const d = habitDefaults(h);
    if (!Array.isArray(d.days) || !d.days.length) d.days = ALLDAYS.slice();
    if (!(d.target > 0)) d.target = 1;
    if (!(d.step > 0)) d.step = 1;
    if (d.createdAt > T) d.createdAt = T;
    return d;
  }) : [];
  p.reminders = Array.isArray(p.reminders) ? p.reminders.filter(r => r && r.id) : [];
  p.createdAt = p.createdAt || T;
  return p;
}

// ---------- persistence ----------
const LS_KEY = 'questline.v1';
const Sync = { mode: 'boot', db: null, dirty: new Set(), inflight: new Set(), timer: 0, last: {}, quiet: {}, error: false, bootCache: null, logsReconciled: false, migrated: false };

function cacheSave() {
  try { localStorage.setItem(LS_KEY, JSON.stringify({ source: Sync.mode === 'cloud' ? 'cloud' : 'local', profile: S.profile, logs: S.logs })); } catch (e) { /* storage blocked: fine */ }
}
function cacheLoad() {
  try { const c = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); return c && typeof c === 'object' ? c : null; } catch (e) { return null; }
}
function busy(key) { return Sync.dirty.has(key) || Sync.inflight.has(key); }
function markDirty(key) {
  Sync.dirty.add(key);
  cacheSave();
  clearTimeout(Sync.timer);
  Sync.timer = setTimeout(flush, 550);
  renderTop();
}
function docRef(key) { return Sync.db.doc(key === 'profile' ? 'app/profile' : key); }
function docData(key) { return key === 'profile' ? S.profile : (S.logs[key.slice(5)] || null); }

async function flush() {
  if (Sync.mode === 'boot') return;
  if (Sync.mode !== 'cloud') { Sync.dirty.clear(); renderTop(); return; }
  const keys = [...Sync.dirty].filter(k => !Sync.inflight.has(k));
  for (const key of keys) {
    Sync.dirty.delete(key);
    Sync.inflight.add(key);
    renderTop();
    await writeDoc(key);
    Sync.inflight.delete(key);
  }
  if (Sync.dirty.size) { clearTimeout(Sync.timer); Sync.timer = setTimeout(flush, 300); }
  renderTop();
}
async function writeDoc(key, attempt = 0) {
  const data = docData(key);
  const json = data ? JSON.stringify(data) : null;
  try {
    if (json) await docRef(key).set(JSON.parse(json));
    else await docRef(key).delete();
    Sync.last[key] = json;
    Sync.quiet[key] = Date.now() + 2000;
    Sync.error = false;
  } catch (e) {
    const code = e && e.code;
    if (code === 'unavailable' && attempt < 1) { await sleep(400 + Math.random() * 700); return writeDoc(key, attempt + 1); }
    if (code === 'quota_exceeded') { toast('Storage is full', { sub: 'Export a backup in You, then archive old quests.', icon: '⚠️' }); Sync.error = true; return; }
    if (code === 'invalid_argument' || code === 'not_granted' || code === 'revoked' || code === 'capability_disabled' || code === 'capability_removed') {
      Sync.mode = 'local'; Sync.error = true; cacheSave();
      toast('Saving on this device', { sub: "This view can't write to your Claude account.", icon: '📱' });
      return;
    }
    Sync.error = true;
    Sync.dirty.add(key);
    clearTimeout(Sync.timer); Sync.timer = setTimeout(flush, 4000);
  }
}
function canAccept(key, json) {
  if (busy(key)) return false;
  if (Date.now() < (Sync.quiet[key] || 0) && json !== Sync.last[key]) {
    setTimeout(() => refetch(key), (Sync.quiet[key] - Date.now()) + 150);
    return false;
  }
  return true;
}
async function refetch(key) {
  if (busy(key) || Sync.mode !== 'cloud') return;
  try {
    const snap = await docRef(key).get();
    if (busy(key)) return;
    if (key === 'profile') { if (snap.exists) applyProfile(snap.data()); }
    else { const id = key.slice(5); if (snap.exists) S.logs[id] = clone(snap.data()); else delete S.logs[id]; cacheSave(); render(); }
  } catch (e) { /* the live subscription will catch up */ }
}
function applyProfile(data) {
  Sync.migrated = true;
  S.profile = migrate(clone(data));
  S.booting = false;
  cacheSave();
  render();
}
function onCloudEmpty() {
  if (busy('profile')) return;
  const c = Sync.bootCache;
  if (c && c.source === 'local' && c.profile && !Sync.migrated) {
    Sync.migrated = true;
    S.profile = migrate(clone(c.profile)); S.logs = clone(c.logs) || {};
    markDirty('profile'); Object.keys(S.logs).forEach(m => markDirty('logs/' + m));
    toast('Synced your quests', { sub: 'Quests saved on this device now sync to your account.', icon: '☁️' });
  } else {
    S.profile = null; S.logs = {}; cacheSave();
  }
  S.booting = false;
  render();
}
function subscribe() { subProfile(); subLogs(); }
function subProfile() {
  Sync.db.doc('app/profile').onSnapshot(snap => {
    if (snap.metadata.hasPendingWrites) return;
    if (!snap.exists) { if (!snap.metadata.fromCache) onCloudEmpty(); return; }
    const json = JSON.stringify(snap.data());
    if (!canAccept('profile', json)) { S.booting = false; return; }
    applyProfile(snap.data());
  }, e => onSubError(e, subProfile));
}
function subLogs() {
  Sync.db.collection('logs').onSnapshot(qs => {
    if (qs.metadata.hasPendingWrites) return;
    let changed = false;
    const seen = new Set();
    for (const d of qs.docs) {
      seen.add(d.id);
      const key = 'logs/' + d.id, json = JSON.stringify(d.data());
      if (!canAccept(key, json)) continue;
      if (JSON.stringify(S.logs[d.id]) !== json) { S.logs[d.id] = JSON.parse(json); changed = true; }
    }
    if (!qs.metadata.fromCache) {
      for (const id of Object.keys(S.logs)) {
        if (!seen.has(id) && !busy('logs/' + id)) { delete S.logs[id]; changed = true; }
      }
    }
    if (changed) { cacheSave(); render(); }
  }, e => onSubError(e, subLogs));
}
function onSubError(e, restart) {
  if (e && e.code === 'unavailable') { setTimeout(restart, 3000); return; }
  Sync.error = true; renderTop();
}

// ---------- domain ----------
const habits = () => (S.profile ? S.profile.habits : []);
const habit = id => habits().find(h => h.id === id);
const reminder = id => (S.profile ? S.profile.reminders.find(r => r.id === id) : null);
function dayLog(k) { const m = S.logs[monthOf(k)]; return (m && m.days && m.days[k]) || {}; }
function getVal(hid, k) { return +dayLog(k)[hid] || 0; }
function editMonth(m) {
  const doc = clone(S.logs[m]) || {};
  doc.days = doc.days || {}; doc.rem = doc.rem || {};
  S.logs[m] = doc;
  return doc;
}
function setVal(hid, k, v) {
  const m = monthOf(k), doc = editMonth(m);
  const day = Object.assign({}, doc.days[k]);
  if (v <= 0) delete day[hid]; else day[hid] = round2(v);
  if (Object.keys(day).length) doc.days[k] = day; else delete doc.days[k];
  markDirty('logs/' + m);
}
function bumpRem(k, d) {
  const m = monthOf(k), doc = editMonth(m);
  const n = Math.max(0, (doc.rem[k] || 0) + d);
  if (n) doc.rem[k] = n; else delete doc.rem[k];
  markDirty('logs/' + m);
}
function activeOn(h, k) { return h.createdAt <= k && (!h.archived || (h.archivedAt && h.archivedAt > k)); }
function scheduled(h, k) { return h.type === 'weekly' || (h.days || ALLDAYS).includes(dow(k)); }
function isDoneDay(h, k) { return getVal(h.id, k) >= h.target; }
function weekSum(h, k) { const ws = weekStartOf(k); let s = 0; for (let i = 0; i < 7; i++) s += getVal(h.id, addDays(ws, i)); return s; }
function isDone(h, k) { return h.type === 'weekly' ? weekSum(h, k) >= h.target : isDoneDay(h, k); }
function dailyOn(k) { return habits().filter(h => h.type !== 'weekly' && activeOn(h, k) && scheduled(h, k)); }
function weeklyOn(k) { return habits().filter(h => h.type === 'weekly' && activeOn(h, k)); }
function sortDaily(list) {
  const idx = new Map(habits().map((h, i) => [h.id, i]));
  return list.slice().sort((a, b) => (TIME_ORDER.indexOf(a.time) - TIME_ORDER.indexOf(b.time)) || (idx.get(a.id) - idx.get(b.id)));
}
function dayFrac(k) {
  const d = dailyOn(k);
  if (!d.length) return null;

    markDirty('profile'); render();
    toast('Reminder added', { sub: fields.date ? relDay(fields.date) + (fields.time ? ' · ' + fmtTime(fields.time) : '') : 'No date', icon: '🔔' });
  }
  closeSheet();
}
function quickRem(form) {
  const f = new FormData(form);
  const title = String(f.get('title') || '').trim();
  if (!title) { form.querySelector('input[name="title"]').focus(); return; }
  const date = whenToDate(f.get('when'));
  const r = { id: uid('r'), title, date, time: date ? (f.get('time') || '') : '', repeat: 'none', important: false, note: '', done: false, doneAt: null, createdAt: todayKey() };
  S.profile.reminders.push(r);
  markDirty('profile');
  form.querySelector('input[name="title"]').value = '';
  form.querySelector('input[name="time"]').value = '';
  render();
  SFX.tick(0.6); buzz(8);
  toast('Reminder added', { sub: date ? relDay(date) + (r.time ? ' · ' + fmtTime(r.time) : '') : 'No date', icon: '🔔', action: date ? { label: 'Alert me', href: gcalUrl({ title, date, time: r.time }) } : null });
}

// ---------- confirmations built into buttons ----------
const armed = new Map();
function confirmTap(el, label, fn) {
  const key = el.id || el.dataset.id || el.dataset.act;
  if (armed.get(key)) { armed.delete(key); fn(); return; }
  armed.set(key, true);
  const orig = el.innerHTML;
  el.classList.add('armed'); el.innerHTML = label;
  buzz(20);
  setTimeout(() => { armed.delete(key); if (el.isConnected) { el.classList.remove('armed'); el.innerHTML = orig; } }, 3500);
}

// ---------- backup ----------
async function exportData() {
  const payload = JSON.stringify({ app: 'questline', v: 1, exportedAt: new Date().toISOString(), profile: S.profile, logs: S.logs }, null, 2);
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
  if (dl) {
    try { await dl.save({ filename: `questline-backup-${todayKey()}.json`, data: payload }); toast('Backup saved', { icon: '💾' }); return; }
    catch (e) { if (e && (e.code === 'declined' || e.code === 'rate_limited')) return; }
  }
  openSheet(`<div class="sh">${sheetHead('Backup')}<p class="hint">Copy this text and keep it somewhere safe, like a note. Import it later from You → Import backup (save it as a .json file first).</p><textarea readonly id="bk-text">${esc(payload)}</textarea><button class="btn primary block" type="button" data-act="copy-backup">${ic('copy')}Copy backup</button></div>`);
}
function importData(file) {
  const rd = new FileReader();
  rd.onload = () => {
    let data;
    try { data = JSON.parse(rd.result); } catch (e) { toast("That file isn't a Questline backup", { icon: '⚠️' }); return; }
    if (!data || data.app !== 'questline' || !data.profile || !Array.isArray(data.profile.habits)) { toast("That file isn't a Questline backup", { icon: '⚠️' }); return; }
    const when = data.exportedAt ? fmtDay(keyOf(new Date(data.exportedAt))) : 'unknown date';
    openSheet(`<div class="sh">${sheetHead('Restore backup?')}<p class="hint">This replaces everything here with the backup from ${esc(when)}: ${data.profile.habits.length} quests and ${(data.profile.reminders || []).length} reminders.</p><div class="sh-actions"><button class="btn primary block" type="button" data-act="do-import">${ic('upload')}Replace with backup</button><button class="btn block" type="button" data-act="close-sheet">Cancel</button></div></div>`);
    S.pendingImport = data;
  };
  rd.readAsText(file);
}
function applyImport() {
  const data = S.pendingImport; if (!data) return;
  S.pendingImport = null;
  const oldMonths = Object.keys(S.logs);
  S.profile = migrate(clone(data.profile));
  S.logs = {};
  for (const m in (data.logs || {})) if (/^\d{4}-\d{2}$/.test(m) && data.logs[m]) S.logs[m] = clone(data.logs[m]);
  markDirty('profile');
  new Set([...oldMonths, ...Object.keys(S.logs)]).forEach(m => markDirty('logs/' + m));
  closeSheet(); render();
  toast('Backup restored', { icon: '✅' });
}
function resetAll() {
  Sync.migrated = true;
  const months = Object.keys(S.logs);
  S.profile = null; S.logs = {};
  markDirty('profile'); months.forEach(m => markDirty('logs/' + m));
  S.tab = 'today'; S.sel = todayKey();
  render();
  toast('Everything was reset', { icon: '🧹' });
}

// ---------- events ----------
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled) { if (!e.target.closest('#tip')) hideTip(); return; }
  const a = t.dataset.act, id = t.dataset.id;
  const origin = pointOf(e, t);
  if (a !== 'tip') hideTip();
  switch (a) {
    case 'tab': setTab(t.dataset.tab); break;
    case 'inc': logStep(id, 1, origin); break;
    case 'dec': logStep(id, -1, origin); break;
    case 'toggle': toggleCheck(id, origin); break;
    case 'setval': openSetVal(id); break;
    case 'detail': openDetail(id); break;
    case 'sel': S.sel = t.dataset.day; render(); break;
    case 'wk': {
      const n = addDays(S.sel, 7 * (+t.dataset.dir));
      S.sel = n > todayKey() ? todayKey() : n; render(); break;
    }
    case 'today': S.sel = todayKey(); render(); break;
    case 'fab': openCreate(); break;
    case 'close-sheet': closeSheet(); break;
    case 'close-overlay': closeOverlay(); break;
    case 'new-quest': openQuestEditor(null, null); break;
    case 'tpl': openQuestEditor(null, t.dataset.tpl); break;
    case 'new-rem': openRemEditor(null); break;
    case 'edit-quest': openQuestEditor(id); break;
    case 'archive': confirmTap(t, `${ic('archive')}Tap again`, () => {
      const h = habit(id); if (!h) return;
      act(() => { h.archived = true; h.archivedAt = todayKey(); markDirty('profile'); }, null);
      closeSheet(); toast('Quest archived', { sub: 'Restore it any time from You.', icon: h.icon, action: { label: 'Undo', fn: () => { act(() => { h.archived = false; h.archivedAt = null; markDirty('profile'); }, null); } } });
    }); break;
    case 'restore': { const h = habit(id); if (h) { act(() => { h.archived = false; h.archivedAt = null; markDirty('profile'); }, null); toast('Quest restored', { sub: h.name, icon: h.icon }); } break; }
    case 'purge': confirmTap(t, 'Sure?', () => {
      const h = habit(id); if (!h) return;
      act(() => {
        S.profile.habits = S.profile.habits.filter(x => x.id !== id);
        for (const m in S.logs) {
          const L = S.logs[m]; if (!L || !L.days) continue;
          if (Object.values(L.days).some(d => d && d[id] != null)) {
            const doc = editMonth(m);
            for (const k in doc.days) { delete doc.days[k][id]; if (!Object.keys(doc.days[k]).length) delete doc.days[k]; }
            markDirty('logs/' + m);
          }
        }
        markDirty('profile');
      }, null);
      toast('Quest deleted', { sub: h.name, icon: '🗑️' });
    }); break;
    case 'move': {
      const list = S.profile.habits, i = list.findIndex(h => h.id === id), j = i + (+t.dataset.dir);
      if (i < 0 || j < 0 || j >= list.length) break;
      [list[i], list[j]] = [list[j], list[i]]; markDirty('profile'); render(); openDetail(id); break;
    }
    case 'remdone': toggleRem(id, origin); break;
    case 'remedit': openRemEditor(id); break;
    case 'rem-del': confirmTap(t, `${ic('trash')}Tap again to delete`, () => {
      const r = reminder(id); if (!r) return;
      S.profile.reminders = S.profile.reminders.filter(x => x.id !== id);
      markDirty('profile'); render(); closeSheet();
      toast('Reminder deleted', { sub: r.title, icon: '🗑️', action: { label: 'Undo', fn: () => { S.profile.reminders.push(r); markDirty('profile'); render(); } } });
    }); break;
    case 'rf-when': {
      const form = t.closest('form'), d = whenToDate(t.dataset.when);
      form.querySelector('#rf-date').value = d;
      if (!d) form.querySelector('#rf-time').value = '';
      form.dispatchEvent(new Event('input')); break;
    }
    case 'sv-step': {
      const inp = $('#sv-v'), h = habit(t.closest('form').dataset.id);
      inp.value = Math.max(0, round2((num(inp.value) || 0) + (+t.dataset.dir) * (h ? h.step : 1))); buzz(6); break;
    }
    case 'sv-set': $('#sv-v').value = t.dataset.v; buzz(6); break;
    case 'tip': showTip(t); break;
    case 'sync-info': {
      const msg = Sync.mode === 'cloud' ? ['Synced to your Claude account', 'Open this link on any device to see the same quests.'] : Sync.mode === 'boot' ? ['Connecting…', 'Hang on a second.'] : ['Saved on this device', 'Open Questline from your claude.ai link while signed in to sync.'];
      toast(msg[0], { sub: msg[1], icon: Sync.mode === 'cloud' ? '☁️' : '📱' }); break;
    }
    case 'export': exportData(); break;
    case 'do-import': applyImport(); break;
    case 'copy-backup': {
      const ta = $('#bk-text');
      const fallback = () => { ta.focus(); ta.select(); toast('Selected. Use Copy from the menu.', { icon: '📋' }); };
      try { navigator.clipboard.writeText(ta.value).then(() => toast('Backup copied', { icon: '📋' }), fallback); } catch (err) { fallback(); }
      break;
    }
    case 'reset': confirmTap(t, `${ic('trash')}Tap again to erase everything`, resetAll); break;
  }
});
document.addEventListener('submit', e => {
  const form = e.target.closest('form[data-form]'); if (!form) return;
  e.preventDefault();
  const kind = form.dataset.form;
  if (kind === 'quest') saveQuest(form);
  else if (kind === 'rem') saveRem(form);
  else if (kind === 'quickrem') quickRem(form);
  else if (kind === 'setval') {
    const h = habit(form.dataset.id); if (!h) return;
    const v = Math.max(0, round2(num(new FormData(form).get('v')) || 0));
    const sv = form.querySelector('[type="submit"]').getBoundingClientRect();
    closeSheet();
    if (v !== getVal(h.id, S.sel)) act(() => setVal(h.id, S.sel, v), { x: innerWidth / 2, y: Math.min(innerHeight * 0.5, sv.top) }, { habit: h, dir: v > getVal(h.id, S.sel) ? 1 : -1 });
  } else if (kind === 'onboard') {
    const f = new FormData(form);
    const chosen = PACKS.filter(p => f.getAll('pack').includes(p.id)).flatMap(p => p.tpls);
    const T = todayKey();
    S.profile = migrate({ name: String(f.get('name') || '').trim() || 'Boss', settings: { sound: true, haptics: true, weekStart: +f.get('ws') }, habits: chosen.map(tk => habitDefaults(Object.assign(clone(TEMPLATES.find(t => t.tpl === tk)), { id: 'h_' + tk, createdAt: T }))), reminders: [], createdAt: T });
    S.tab = 'today'; S.sel = T;
    markDirty('profile');
    render();
    rain(); SFX.level(); buzz([20, 50, 20]);
    toast(`Welcome, ${S.profile.name}`, { sub: chosen.length ? `${chosen.length} quests loaded. Tap + to add more.` : 'Tap + to add your first quest.', icon: '✨' });
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'importFile' && t.files && t.files[0]) { importData(t.files[0]); t.value = ''; return; }
  const form = t.closest('form[data-form="quest"]');
  if (form && t.name === 'type') { form.dataset.type = t.value; return; }
  if (form && t.name === 'icon') { form.querySelector('[name="iconCustom"]').value = ''; return; }
  const k = t.dataset.set; if (!k || !S.profile) return;
  if (k === 'name') S.profile.name = t.value.trim();
  else if (k === 'weekStart') S.profile.settings.weekStart = +t.value;
  else S.profile.settings[k] = t.checked;
  markDirty('profile'); render();
  if (k === 'sound' && t.checked) SFX.done();
  if (k === 'haptics' && t.checked) buzz([15, 40, 15]);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('#overlay').hidden) closeOverlay(); else closeSheet(); }
});
document.addEventListener('mouseover', e => { const t = e.target.closest('[data-act="tip"]'); if (t && matchMedia('(hover: hover)').matches) showTip(t); });
document.addEventListener('mouseout', e => { if (e.target.closest('[data-act="tip"]') && matchMedia('(hover: hover)').matches) hideTip(); });
window.addEventListener('scroll', hideTip, { passive: true });
window.addEventListener('resize', fxResize);
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.profile) render(); });
setInterval(() => { if (todayKey() !== S.today && S.profile) render(); }, 60000);

// ---------- boot ----------
async function boot() {
  FX.cv = $('#fx'); FX.ctx = FX.cv.getContext('2d'); fxResize();
  const cache = cacheLoad();
  Sync.bootCache = cache;
  if (cache && cache.profile) {
    S.profile = migrate(clone(cache.profile));
    S.logs = clone(cache.logs) || {};
    S.booting = false;
  }
  render();
  let db = null;
  try { db = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('db') : null; } catch (e) { db = null; }
  if (!db) {
    Sync.mode = 'local';
    S.booting = false;
    Sync.dirty.clear();
    cacheSave();
    render();
    return;
  }
  Sync.mode = 'cloud';
  Sync.db = db;
  subscribe();
  if (Sync.dirty.size) flush();
  renderTop();
  setTimeout(() => { if (S.booting) { S.booting = false; render(); } }, 12000);
}
boot();
</script>
